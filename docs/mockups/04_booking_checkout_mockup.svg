<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="390" height="844" rx="44" fill="#F8FAFC" />

  <!-- Dynamic Island & Status Bar -->
  <rect x="135" y="14" width="120" height="28" rx="14" fill="#000000" />
  <text x="32" y="38" fill="#1E293B" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">9:41</text>
  <rect x="340" y="28" width="18" height="10" rx="3" fill="none" stroke="#1E293B" stroke-width="2" />
  <rect x="342" y="30" width="12" height="6" rx="1.5" fill="#1E293B" />

  <!-- Nav Header -->
  <g transform="translate(20, 60)">
    <circle cx="20" cy="20" r="20" fill="#FFFFFF" filter="url(#shadow)" />
    <text x="20" y="26" font-size="16" text-anchor="middle">←</text>
    <text x="195" y="26" fill="#1E293B" font-family="sans-serif" font-size="17" font-weight="700" text-anchor="middle">Xác nhận đặt sự kiện</text>
  </g>

  <!-- Service Snapshot Card -->
  <g transform="translate(20, 115)" filter="url(#shadow)">
    <rect width="350" height="95" rx="18" fill="#FFFFFF" />
    <rect x="12" y="12" width="70" height="71" rx="12" fill="#E0E7FF" />
    <text x="47" y="52" fill="#4F46E5" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">EVENT</text>
    
    <text x="94" y="34" fill="#1E293B" font-family="sans-serif" font-size="14" font-weight="700">Trọn Gói Tiệc Cưới Hoàng Gia</text>
    <text x="94" y="54" fill="#64748B" font-family="sans-serif" font-size="12">Gói: Tiêu Chuẩn (Silver)</text>
    <text x="94" y="74" fill="#4F46E5" font-family="sans-serif" font-size="15" font-weight="800">18.500.000 ₫</text>
  </g>

  <!-- Event Information Inputs -->
  <g transform="translate(20, 230)">
    <text x="0" y="0" fill="#1E293B" font-family="sans-serif" font-size="16" font-weight="700">Thông tin tổ chức</text>

    <!-- Field 1: Ngày tổ chức -->
    <rect x="0" y="12" width="350" height="52" rx="14" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="16" y="42" fill="#64748B" font-size="15">📅</text>
    <text x="44" y="34" fill="#64748B" font-family="sans-serif" font-size="11">Ngày tổ chức</text>
    <text x="44" y="52" fill="#1E293B" font-family="sans-serif" font-size="13" font-weight="600">20/11/2026 (18:00 - 22:00)</text>

    <!-- Field 2: Địa điểm -->
    <rect x="0" y="74" width="350" height="52" rx="14" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="16" y="104" fill="#64748B" font-size="15">📍</text>
    <text x="44" y="96" fill="#64748B" font-family="sans-serif" font-size="11">Địa điểm / Hội trường</text>
    <text x="44" y="114" fill="#1E293B" font-family="sans-serif" font-size="13" font-weight="600">Khách sạn Lotte, Ba Đình, Hà Nội</text>

    <!-- Field 3: Số khách -->
    <rect x="0" y="136" width="350" height="52" rx="14" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="16" y="166" fill="#64748B" font-size="15">👥</text>
    <text x="44" y="158" fill="#64748B" font-family="sans-serif" font-size="11">Số lượng khách dự kiến</text>
    <text x="44" y="176" fill="#1E293B" font-family="sans-serif" font-size="13" font-weight="600">250 khách</text>
  </g>

  <!-- Payment Methods Selection -->
  <g transform="translate(20, 445)">
    <text x="0" y="0" fill="#1E293B" font-family="sans-serif" font-size="16" font-weight="700">Phương thức thanh toán</text>

    <!-- Gateway 1: VNPay QR (Selected) -->
    <rect x="0" y="14" width="350" height="54" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" />
    <rect x="14" y="24" width="32" height="32" rx="8" fill="#0284C7" />
    <text x="30" y="45" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">VNP</text>
    <text x="58" y="38" fill="#1E293B" font-family="sans-serif" font-size="14" font-weight="600">Cổng thanh toán VNPay</text>
    <text x="58" y="56" fill="#6366F1" font-family="sans-serif" font-size="11">Quét mã VNPAY-QR / Thẻ ATM / Visa</text>
    <circle cx="325" cy="41" r="8" fill="#4F46E5" />
    <circle cx="325" cy="41" r="3" fill="#FFFFFF" />

    <!-- Gateway 2: MoMo -->
    <rect x="0" y="78" width="350" height="54" rx="14" fill="#FFFFFF" stroke="#E2E8F0" />
    <rect x="14" y="88" width="32" height="32" rx="8" fill="#BE123C" />
    <text x="30" y="109" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">MoMo</text>
    <text x="58" y="102" fill="#1E293B" font-family="sans-serif" font-size="14" font-weight="600">Ví điện tử MoMo</text>
    <text x="58" y="120" fill="#64748B" font-family="sans-serif" font-size="11">Chuyển ví nhanh chóng tiện lợi</text>
    <circle cx="325" cy="105" r="8" fill="none" stroke="#CBD5E1" stroke-width="2" />

    <!-- Gateway 3: SePay Chuyển khoản QR tự động -->
    <rect x="0" y="142" width="350" height="54" rx="14" fill="#FFFFFF" stroke="#E2E8F0" />
    <rect x="14" y="152" width="32" height="32" rx="8" fill="#059669" />
    <text x="30" y="173" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">SePay</text>
    <text x="58" y="166" fill="#1E293B" font-family="sans-serif" font-size="14" font-weight="600">SePay QR Ngân Hàng Tự Động</text>
    <text x="58" y="184" fill="#64748B" font-family="sans-serif" font-size="11">Xác thực giao dịch tự động trong 3 giây</text>
    <circle cx="325" cy="169" r="8" fill="none" stroke="#CBD5E1" stroke-width="2" />
  </g>

  <!-- Sticky Bottom Checkout -->
  <g transform="translate(0, 745)" filter="url(#shadow)">
    <rect width="390" height="99" fill="#FFFFFF" />
    <text x="24" y="32" fill="#64748B" font-family="sans-serif" font-size="12">Tổng thanh toán</text>
    <text x="24" y="58" fill="#4F46E5" font-family="sans-serif" font-size="22" font-weight="800">18.500.000 ₫</text>
    
    <rect x="200" y="20" width="166" height="52" rx="16" fill="#4F46E5" />
    <text x="283" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Thanh toán ngay →</text>
  </g>

  <!-- Home Indicator -->
  <rect x="125" y="828" width="140" height="5" rx="2.5" fill="#1E293B" opacity="0.3" />
</svg>
