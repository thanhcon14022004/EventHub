<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="390" height="844" rx="44" fill="#0F172A" />

  <!-- Dynamic Island & Status Bar -->
  <rect x="135" y="14" width="120" height="28" rx="14" fill="#1E293B" />
  <text x="32" y="38" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">9:41</text>
  <rect x="340" y="28" width="18" height="10" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2" />
  <rect x="342" y="30" width="12" height="6" rx="1.5" fill="#FFFFFF" />

  <!-- Nav Header -->
  <g transform="translate(20, 60)">
    <circle cx="20" cy="20" r="20" fill="#1E293B" />
    <text x="20" y="25" fill="#FFFFFF" font-size="14" text-anchor="middle">🏢</text>
    <text x="52" y="18" fill="#94A3B8" font-family="sans-serif" font-size="12">Kênh đối tác</text>
    <text x="52" y="36" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">Royal Wedding Design ▾</text>
    <circle cx="330" cy="20" r="18" fill="#1E293B" />
    <text x="330" y="25" fill="#FFFFFF" font-size="15" text-anchor="middle">🔔</text>
  </g>

  <!-- Revenue & Orders KPI Row -->
  <g transform="translate(20, 115)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="168" height="84" rx="16" fill="#1E293B" stroke="#334155" />
    <text x="16" y="28" fill="#94A3B8" font-family="sans-serif" font-size="12">Doanh thu tháng này</text>
    <text x="16" y="56" fill="#38BDF8" font-family="sans-serif" font-size="18" font-weight="800">128.500.000 ₫</text>
    <text x="16" y="74" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="bold">↑ 18.2% so với tháng trước</text>

    <!-- KPI 2 -->
    <rect x="182" y="0" width="168" height="84" rx="16" fill="#1E293B" stroke="#334155" />
    <text x="198" y="28" fill="#94A3B8" font-family="sans-serif" font-size="12">Đơn cần xử lý</text>
    <text x="198" y="56" fill="#FBBF24" font-family="sans-serif" font-size="22" font-weight="800">5 đơn mới</text>
    <text x="198" y="74" fill="#94A3B8" font-family="sans-serif" font-size="10">2 đơn chờ duyệt</text>
  </g>

  <!-- Section Title -->
  <g transform="translate(20, 225)">
    <text x="0" y="0" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">Danh sách đơn đặt tiếp nhận</text>
    <text x="350" y="0" fill="#818CF8" font-family="sans-serif" font-size="13" text-anchor="end">Lọc ▾</text>
  </g>

  <!-- Provider Order Card 1 (Pending Provider Approval) -->
  <g transform="translate(20, 245)" filter="url(#shadow)">
    <rect width="350" height="230" rx="18" fill="#1E293B" stroke="#334155" />
    
    <text x="16" y="32" fill="#94A3B8" font-family="monospace" font-size="12">#EH-20261120-839</text>
    <rect x="225" y="16" width="110" height="24" rx="12" fill="#451A03" />
    <text x="280" y="32" fill="#FBBF24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">⏳ Chờ duyệt đơn</text>

    <line x1="16" y1="48" x2="334" y2="48" stroke="#334155" stroke-width="1.5" />

    <text x="16" y="74" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Tiệc cưới tại TT Hội Nghị Quốc Gia</text>
    <text x="16" y="96" fill="#CBD5E1" font-family="sans-serif" font-size="12">Khách hàng: Nguyễn Văn An (0912.345.678)</text>
    <text x="16" y="116" fill="#CBD5E1" font-family="sans-serif" font-size="12">Ngày diễn ra: 20/11/2026 • 250 khách</text>
    <text x="16" y="138" fill="#38BDF8" font-family="sans-serif" font-size="16" font-weight="800">18.500.000 ₫</text>

    <!-- Action Buttons for Provider: Accept & Reject -->
    <rect x="16" y="160" width="150" height="46" rx="12" fill="#22C55E" />
    <text x="91" y="188" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">✓ Nhận đơn</text>

    <rect x="184" y="160" width="150" height="46" rx="12" fill="#EF4444" />
    <text x="259" y="188" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">✕ Từ chối</text>
  </g>

  <!-- Provider Order Card 2 (InProgress) -->
  <g transform="translate(20, 495)" filter="url(#shadow)">
    <rect width="350" height="205" rx="18" fill="#1E293B" stroke="#334155" />
    
    <text x="16" y="32" fill="#94A3B8" font-family="monospace" font-size="12">#EH-20261105-441</text>
    <rect x="225" y="16" width="110" height="24" rx="12" fill="#172554" />
    <text x="280" y="32" fill="#60A5FA" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">⚡ Đang thực hiện</text>

    <line x1="16" y1="48" x2="334" y2="48" stroke="#334155" stroke-width="1.5" />

    <text x="16" y="74" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Trang Trí Sinh Nhật Chủ Đề Đại Dương</text>
    <text x="16" y="96" fill="#CBD5E1" font-family="sans-serif" font-size="12">Khách hàng: Trần Thị Mai • Hôm nay</text>
    
    <!-- Action Button: Mark Completed -->
    <rect x="16" y="130" width="318" height="48" rx="12" fill="#6366F1" />
    <text x="175" y="159" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Hoàn thành dịch vụ (Completed) 🏁</text>
  </g>

  <!-- Provider Bottom Nav -->
  <g transform="translate(0, 755)">
    <rect width="390" height="89" fill="#1E293B" stroke="#334155" />
    <g transform="translate(50, 16)">
      <text x="0" y="16" fill="#6366F1" font-size="20">📋</text>
      <text x="-6" y="34" fill="#6366F1" font-family="sans-serif" font-size="11" font-weight="700">Đơn hàng</text>
    </g>
    <g transform="translate(150, 16)">
      <text x="0" y="16" fill="#94A3B8" font-size="20">✨</text>
      <text x="-4" y="34" fill="#94A3B8" font-family="sans-serif" font-size="11">Dịch vụ</text>
    </g>
    <g transform="translate(250, 16)">
      <text x="0" y="16" fill="#94A3B8" font-size="20">📊</text>
      <text x="-8" y="34" fill="#94A3B8" font-family="sans-serif" font-size="11">Doanh thu</text>
    </g>
    <g transform="translate(340, 16)">
      <text x="0" y="16" fill="#94A3B8" font-size="20">⚙️</text>
      <text x="-4" y="34" fill="#94A3B8" font-family="sans-serif" font-size="11">Cài đặt</text>
    </g>
  </g>

  <!-- Home Indicator -->
  <rect x="125" y="828" width="140" height="5" rx="2.5" fill="#FFFFFF" opacity="0.3" />
</svg>
