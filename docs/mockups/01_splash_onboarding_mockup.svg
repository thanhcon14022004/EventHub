<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Device Frame Background -->
  <rect width="390" height="844" rx="44" fill="url(#bgGrad)" />

  <!-- Status Bar -->
  <text x="32" y="38" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">9:41</text>
  <circle cx="330" cy="34" r="3" fill="#FFFFFF" />
  <rect x="340" y="28" width="18" height="10" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2" />
  <rect x="342" y="30" width="12" height="6" rx="1.5" fill="#FFFFFF" />

  <!-- Dynamic Island -->
  <rect x="135" y="14" width="120" height="28" rx="14" fill="#000000" />

  <!-- App Logo & Branding -->
  <g transform="translate(145, 180)" filter="url(#cardShadow)">
    <rect width="100" height="100" rx="28" fill="#FFFFFF" />
    <path d="M 25 30 L 75 30 L 75 42 L 40 42 L 40 50 L 70 50 L 70 62 L 40 62 L 40 70 L 75 70 L 75 82 L 25 82 Z" fill="#4F46E5" />
  </g>

  <text x="195" y="325" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="32" font-weight="800" text-anchor="middle">EventHub</text>
  <text x="195" y="355" fill="#E0E7FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="15" text-anchor="middle">Nền tảng đặt dịch vụ sự kiện số 1</text>

  <!-- Role Selection Card -->
  <g transform="translate(24, 430)" filter="url(#cardShadow)">
    <rect width="342" height="340" rx="28" fill="#FFFFFF" />
    
    <text x="24" y="44" fill="#1E293B" font-family="sans-serif" font-size="20" font-weight="700">Chào mừng bạn 👋</text>
    <text x="24" y="68" fill="#64748B" font-family="sans-serif" font-size="13">Chọn vai trò đăng nhập để tiếp tục trải nghiệm</text>

    <!-- Role Option 1: Khách hàng -->
    <rect x="20" y="90" width="302" height="66" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" />
    <circle cx="52" cy="123" r="18" fill="#6366F1" />
    <text x="52" y="128" fill="#FFFFFF" font-size="16" text-anchor="middle">👤</text>
    <text x="82" y="117" fill="#1E293B" font-family="sans-serif" font-size="15" font-weight="600">Khách hàng tổ chức sự kiện</text>
    <text x="82" y="136" fill="#6366F1" font-family="sans-serif" font-size="12">Tìm kiếm, đặt lịch &amp; thanh toán nhanh</text>

    <!-- Role Option 2: Nhà cung cấp -->
    <rect x="20" y="168" width="302" height="66" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="52" cy="201" r="18" fill="#E2E8F0" />
    <text x="52" y="206" fill="#64748B" font-size="16" text-anchor="middle">🏢</text>
    <text x="82" y="195" fill="#1E293B" font-family="sans-serif" font-size="15" font-weight="600">Đối tác &amp; Nhà cung cấp</text>
    <text x="82" y="214" fill="#64748B" font-family="sans-serif" font-size="12">Quản lý dịch vụ &amp; tiếp nhận đơn</text>

    <!-- Sign In Button -->
    <rect x="20" y="254" width="302" height="52" rx="16" fill="#4F46E5" />
    <text x="171" y="286" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Bắt đầu ngay →</text>
  </g>

  <!-- Home Indicator -->
  <rect x="125" y="828" width="140" height="5" rx="2.5" fill="#FFFFFF" opacity="0.6" />
</svg>
