<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="390" height="844" rx="44" fill="#F8FAFC" />

  <!-- Dynamic Island & Status Bar -->
  <rect x="135" y="14" width="120" height="28" rx="14" fill="#000000" />
  <text x="32" y="38" fill="#1E293B" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">9:41</text>
  <rect x="340" y="28" width="18" height="10" rx="3" fill="none" stroke="#1E293B" stroke-width="2" />
  <rect x="342" y="30" width="12" height="6" rx="1.5" fill="#1E293B" />

  <!-- Nav Header -->
  <g transform="translate(20, 60)">
    <text x="0" y="24" fill="#1E293B" font-family="sans-serif" font-size="22" font-weight="800">Đơn đặt của tôi</text>
    <circle cx="330" cy="18" r="18" fill="#FFFFFF" filter="url(#shadow)" />
    <text x="330" y="23" font-size="15" text-anchor="middle">🔍</text>
  </g>

  <!-- Status Tabs Horizontal Bar -->
  <g transform="translate(20, 105)">
    <!-- Tab 1 -->
    <rect x="0" y="0" width="90" height="34" rx="17" fill="#4F46E5" />
    <text x="45" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Tất cả (4)</text>

    <!-- Tab 2 -->
    <rect x="98" y="0" width="85" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="140" y="22" fill="#64748B" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">Đã duyệt</text>

    <!-- Tab 3 -->
    <rect x="191" y="0" width="105" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="243" y="22" fill="#64748B" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">Đang tiến hành</text>

    <!-- Tab 4 -->
    <rect x="304" y="0" width="85" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="346" y="22" fill="#64748B" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle">Hoàn thành</text>
  </g>

  <!-- Booking Card 1 (Confirmed with Countdown Timer) -->
  <g transform="translate(20, 155)" filter="url(#shadow)">
    <rect width="350" height="235" rx="20" fill="#FFFFFF" />
    
    <!-- Header Row -->
    <text x="16" y="32" fill="#64748B" font-family="monospace" font-size="12">Mã đơn: #EH-20261120-839</text>
    <rect x="235" y="16" width="100" height="24" rx="12" fill="#DCFCE7" />
    <text x="285" y="32" fill="#15803D" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">● Đã xác nhận</text>

    <line x1="16" y1="48" x2="334" y2="48" stroke="#F1F5F9" stroke-width="1.5" />

    <!-- Details -->
    <text x="16" y="74" fill="#1E293B" font-family="sans-serif" font-size="15" font-weight="700">Trọn Gói Tiệc Cưới Hoàng Gia</text>
    <text x="16" y="94" fill="#64748B" font-family="sans-serif" font-size="12">Nhà cung cấp: Royal Wedding Design</text>
    <text x="16" y="114" fill="#64748B" font-family="sans-serif" font-size="12">Ngày tổ chức: 20/11/2026 • 250 khách</text>
    <text x="16" y="136" fill="#4F46E5" font-family="sans-serif" font-size="16" font-weight="800">18.500.000 ₫ (Đã thanh toán VNPay)</text>

    <!-- Event Countdown Timer Box -->
    <rect x="16" y="152" width="318" height="42" rx="10" fill="#EFF6FF" stroke="#BFDBFE" />
    <text x="28" y="177" font-size="14">⏳</text>
    <text x="48" y="177" fill="#1D4ED8" font-family="sans-serif" font-size="12" font-weight="700">Đếm ngược sự kiện: 15 ngày 08 giờ 12 phút</text>

    <!-- Action Buttons -->
    <rect x="200" y="200" width="134" height="26" rx="6" fill="#EEF2FF" />
    <text x="267" y="217" fill="#4F46E5" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Đồng bộ Calendar 📅</text>
  </g>

  <!-- Booking Card 2 (Completed with Star Review Button) -->
  <g transform="translate(20, 410)" filter="url(#shadow)">
    <rect width="350" height="210" rx="20" fill="#FFFFFF" />
    
    <text x="16" y="32" fill="#64748B" font-family="monospace" font-size="12">Mã đơn: #EH-20261015-112</text>
    <rect x="235" y="16" width="100" height="24" rx="12" fill="#F1F5F9" />
    <text x="285" y="32" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓ Hoàn thành</text>

    <line x1="16" y1="48" x2="334" y2="48" stroke="#F1F5F9" stroke-width="1.5" />

    <text x="16" y="74" fill="#1E293B" font-family="sans-serif" font-size="15" font-weight="700">Dàn Âm Thanh Ánh Sáng Gala</text>
    <text x="16" y="94" fill="#64748B" font-family="sans-serif" font-size="12">Nhà cung cấp: SoundPro Master</text>
    <text x="16" y="114" fill="#64748B" font-family="sans-serif" font-size="12">Ngày tổ chức: 15/10/2026</text>
    <text x="16" y="136" fill="#1E293B" font-family="sans-serif" font-size="16" font-weight="800">9.200.000 ₫</text>

    <!-- Review Rating Call to action -->
    <rect x="16" y="152" width="318" height="44" rx="12" fill="#FEF3C7" stroke="#FDE68A" />
    <text x="28" y="179" font-size="15">⭐</text>
    <text x="50" y="178" fill="#B45309" font-family="sans-serif" font-size="12" font-weight="700">Đã đánh giá: 5 sao (Dịch vụ xuất sắc!)</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 755)" filter="url(#shadow)">
    <rect width="390" height="89" fill="#FFFFFF" />
    <g transform="translate(42, 12)">
      <text x="0" y="16" fill="#94A3B8" font-size="20">🏠</text>
      <text x="-4" y="34" fill="#64748B" font-family="sans-serif" font-size="11">Trang chủ</text>
    </g>
    <g transform="translate(122, 12)">
      <text x="0" y="16" fill="#4F46E5" font-size="20">📅</text>
      <text x="-8" y="34" fill="#4F46E5" font-family="sans-serif" font-size="11" font-weight="700">Đơn đặt</text>
    </g>
    <g transform="translate(202, 12)">
      <text x="0" y="16" fill="#94A3B8" font-size="20">❤️</text>
      <text x="-6" y="34" fill="#64748B" font-family="sans-serif" font-size="11">Yêu thích</text>
    </g>
    <g transform="translate(275, 12)">
      <text x="0" y="16" fill="#94A3B8" font-size="20">💬</text>
      <text x="-4" y="34" fill="#64748B" font-family="sans-serif" font-size="11">Tin nhắn</text>
    </g>
    <g transform="translate(340, 12)">
      <text x="0" y="16" fill="#94A3B8" font-size="20">👤</text>
      <text x="-6" y="34" fill="#64748B" font-family="sans-serif" font-size="11">Tài khoản</text>
    </g>
  </g>

  <!-- Home Indicator -->
  <rect x="125" y="828" width="140" height="5" rx="2.5" fill="#1E293B" opacity="0.3" />
</svg>
