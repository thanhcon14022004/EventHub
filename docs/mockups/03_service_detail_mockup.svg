<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="390" height="844" rx="44" fill="#F8FAFC" />

  <!-- Hero Image Area -->
  <rect width="390" height="280" rx="44" fill="#C7D2FE" />
  <rect y="240" width="390" height="40" fill="#C7D2FE" />
  <text x="195" y="160" fill="#4338CA" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Hình Ảnh Thực Tế Không Gian Tiệc</text>

  <!-- Dynamic Island -->
  <rect x="135" y="14" width="120" height="28" rx="14" fill="#000000" />

  <!-- Floating Nav Controls -->
  <g transform="translate(20, 56)">
    <circle cx="20" cy="20" r="20" fill="#FFFFFF" opacity="0.9" filter="url(#shadow)" />
    <text x="20" y="26" font-size="16" text-anchor="middle">←</text>

    <circle cx="310" cy="20" r="20" fill="#FFFFFF" opacity="0.9" filter="url(#shadow)" />
    <text x="310" y="26" font-size="16" text-anchor="middle">❤️</text>

    <circle cx="355" cy="20" r="20" fill="#FFFFFF" opacity="0.9" filter="url(#shadow)" />
    <text x="355" y="26" font-size="16" text-anchor="middle">📤</text>
  </g>

  <!-- Detail Sheet Body -->
  <g transform="translate(0, 260)">
    <rect width="390" height="510" rx="28" fill="#FFFFFF" />
    
    <!-- Title & Rating -->
    <text x="24" y="38" fill="#1E293B" font-family="sans-serif" font-size="20" font-weight="700">Trọn Gói Tiệc Cưới Hoàng Gia Luxury</text>
    <text x="24" y="62" fill="#F59E0B" font-family="sans-serif" font-size="13" font-weight="bold">⭐ 4.9 (128 đánh giá) • Hà Nội</text>
    
    <line x1="24" y1="80" x2="366" y2="80" stroke="#F1F5F9" stroke-width="1.5" />

    <!-- Provider Profile Card -->
    <rect x="24" y="96" width="342" height="66" rx="16" fill="#F8FAFC" stroke="#E2E8F0" />
    <circle cx="56" cy="129" r="20" fill="#E0E7FF" />
    <text x="56" y="134" fill="#4F46E5" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">RW</text>
    <text x="88" y="122" fill="#1E293B" font-family="sans-serif" font-size="15" font-weight="600">Royal Wedding Design</text>
    <text x="88" y="142" fill="#10B981" font-family="sans-serif" font-size="12">✓ Đã xác thực giấy phép đối tác</text>
    <text x="340" y="133" fill="#6366F1" font-size="16" text-anchor="middle">💬</text>

    <!-- Packages Section -->
    <text x="24" y="195" fill="#1E293B" font-family="sans-serif" font-size="16" font-weight="700">Chọn gói dịch vụ phù hợp</text>

    <!-- Package Option 1 (Selected) -->
    <rect x="24" y="210" width="342" height="74" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="2" />
    <circle cx="48" cy="247" r="10" fill="#6366F1" />
    <circle cx="48" cy="247" r="4" fill="#FFFFFF" />
    <text x="70" y="238" fill="#1E293B" font-family="sans-serif" font-size="15" font-weight="700">Gói Tiêu Chuẩn (Silver)</text>
    <text x="70" y="258" fill="#64748B" font-family="sans-serif" font-size="12">Trang trí sân khấu, bàn gallery, âm thanh cơ bản</text>
    <text x="350" y="247" fill="#4F46E5" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="end">18.500.000 ₫</text>

    <!-- Package Option 2 -->
    <rect x="24" y="295" width="342" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="48" cy="332" r="10" fill="none" stroke="#CBD5E1" stroke-width="2" />
    <text x="70" y="323" fill="#1E293B" font-family="sans-serif" font-size="15" font-weight="600">Gói Cao Cấp (Diamond)</text>
    <text x="70" y="343" fill="#64748B" font-family="sans-serif" font-size="12">Hoa tươi 100%, đèn kinetic, màn sao, quay flycam</text>
    <text x="350" y="332" fill="#64748B" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="end">32.000.000 ₫</text>

    <!-- Description Snippet -->
    <text x="24" y="400" fill="#1E293B" font-family="sans-serif" font-size="16" font-weight="700">Mô tả chi tiết</text>
    <text x="24" y="424" fill="#475569" font-family="sans-serif" font-size="13">Đội ngũ nghệ nhân thiết kế sân khấu tiệc cưới trọn gói...</text>
  </g>

  <!-- Bottom Booking Bar -->
  <g transform="translate(0, 755)" filter="url(#shadow)">
    <rect width="390" height="89" fill="#FFFFFF" />
    <text x="24" y="28" fill="#64748B" font-family="sans-serif" font-size="12">Giá trọn gói</text>
    <text x="24" y="52" fill="#4F46E5" font-family="sans-serif" font-size="20" font-weight="800">18.500.000 ₫</text>
    
    <!-- Action Button -->
    <rect x="210" y="16" width="156" height="50" rx="16" fill="#4F46E5" />
    <text x="288" y="47" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Đặt dịch vụ</text>
  </g>

  <!-- Home Indicator -->
  <rect x="125" y="828" width="140" height="5" rx="2.5" fill="#1E293B" opacity="0.3" />
</svg>
